plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"weaponry" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Multiplayer testing on one PC: runServer uses run/, each client gets its own folder and name,
	// so all three can run at once without fighting over options and log files.
	runs {
		client {
			runDir "run/client1"
			programArgs "--username", "Player1"
		}
		client2 {
			client()
			source sourceSets.client
			name "Minecraft Client 2"
			runDir "run/client2"
			programArgs "--username", "Player2"
		}
		// Scripted client check of the keys, frames and tooltips: ./gradlew runClientE2E. Opens a game window,
		// so it isn't part of ./gradlew build. Source in src/gametest (CrossbowClientE2E).
		clientE2E {
			client()
			source sourceSets.client
			name "Client E2E"
			runDir "build/run/clientE2E"
			programArgs "--username", "Player1"
			vmArg "-Dweaponry.clientE2E=true"
		}
	}
}

fabricApi {
	// Generates models, lang, recipes and tags from WeaponType/WeaponMaterial into src/main/generated.
	// Run with: ./gradlew runDatagen
	configureDataGeneration()

	// Automated checks: ./gradlew runGameTest runs src/gametest in a real server (also part of ./gradlew build).
	configureTests {
		createSourceSet = true
		modId = "weaponry-test"
		enableClientGameTests = false
		eula = true
	}
}

// The client check needs the client classes, and to be on that run's classpath along with them.
afterEvaluate {
	sourceSets.gametest.compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
	tasks.named("runClientE2E") {
		classpath += sourceSets.gametest.runtimeClasspath
		def options = file("build/run/clientE2E/options.txt")
		doFirst {
			// Quiet, no first-launch screen, and a window in the background doesn't pause the game.
			options.parentFile.mkdirs()
			options.text = "onboardAccessibility:false\npauseOnLostFocus:false\nsoundCategory_master:0.0\ntutorialStep:none\n"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
